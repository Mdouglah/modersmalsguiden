<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ModersmålsGuiden – differentierad lektionsplanering för modersmålslärare i svenska skolan, kopplat till Lgr22." />
    <title>ModersmålsGuiden</title>
    <style>
      /* ===== Norvay-tema (samma som kuratorn-allman/src/theme.css), kategori skola ===== */
      :root {
        --n-bg: #f5f3ec; --n-surface: #ffffff; --n-ink: #123f37; --n-ink-soft: #4f6b63; --n-line: rgba(18,63,55,0.14);
        --n-terracotta: #c9785f; --n-accent: #2f6b5a; --n-tint: #d7e2d7;
        --mg-guldaccent: #74562a;              /* mörkt guld för liten text (kontrast 4,9+) */
        --mg-guldaccent-dekor: #b9915a;        /* ljust guld bara som dekor (ringar) */
        --mg-guldaccent-yta: rgba(185,145,90,0.12);
        --mg-guldaccent-kant: rgba(185,145,90,0.45);
        --mg-avstangd-yta: #e3e7e1;             /* avstängd knapp */
        --mg-avstangd-text: #4f6b63;            /* text på avstängd knapp (kontrast 4,6) */
        --mg-rubrik-em: #a4533c;               /* mörkare terrakotta för stor rubrik (kontrast) */
      }
      body { margin: 0; background: #f5f3ec; }
      /* Rubriker i Newsreader har vanlig vikt i Norvay-temat */
      [style*="Newsreader"] { font-weight: 400 !important; }
      /* Startsidans sidhuvud: layout "stack" med formen "circle" */
      .mg-motif { position: relative; width: 120px; aspect-ratio: 1; margin: 0 auto 18px; display: grid; place-items: center; font-size: 2.6rem; isolation: isolate; }
      .mg-motif::before { content: ""; position: absolute; inset: 10%; border-radius: 50%; background: var(--n-tint); z-index: -1; }
      .mg-motif::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px dotted var(--mg-guldaccent-dekor); }
      .mg-hero-title em { font-style: italic; color: var(--mg-rubrik-em); }
      :focus-visible { outline: 3px solid var(--n-accent); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
      /* ===== Appens färger (ändra här) – ljust Norvay-tema (skola) med guld som liten accent ===== */
      :root {
        --mg-guld: #2f6b5a; /* guld (accent) */
        --mg-guld-mork: #24564a; /* mörkt guld (toningar) */
        --mg-guld-ljus: #24564a; /* ljust guld */
        --mg-guld-text: #123f37; /* guldtext i lärarens bubbla */
        --mg-guld-2: #74562a; /* guld 2 */
        --mg-guld-3: #74562a; /* guld 3 */
        --mg-orange: #2f6b5a; /* feedbackknapp (förut orange) */
        --mg-orange-mork: #24564a; /* feedbackknapp, toning (förut mörkorange) */
        --mg-bg-1: #f5f3ec; /* bakgrund, mörkast */
        --mg-bg-2: #f5f3ec; /* bakgrund 2 */
        --mg-bg-3: #f5f3ec; /* bakgrund 3 */
        --mg-text: #123f37; /* ljus text */
        --mg-text-2: #123f37; /* ljus text 2 */
        --mg-text-3: #2f4d46; /* ljus text 3 */
        --mg-text-4: #2f4d46; /* ljus text 4 */
        --mg-text-5: #2f4d46; /* ljus text 5 */
        --mg-text-6: #4f6b63; /* ljus text 6 */
        --mg-dampad: #4f6b63; /* dämpad */

        --mg-dampad-3: #4f6b63; /* dämpad 3 */

        --mg-dampad-8: #4f6b63; /* dämpad 8 */
        --mg-dampad-9: #4f6b63; /* dämpad 9 */
        --mg-bla: #2f6b5a; /* blå */
        --mg-bla-mork: #24564a; /* mörkblå */
        --mg-bla-ljus: #123f37; /* ljusblå */
        --mg-bla-ljus-2: #2f4d46; /* ljusblå 2 */
        --mg-lila: #2f6b5a; /* lila */
        --mg-lila-mork: #24564a; /* mörklila (utskriftsknapp) */
        --mg-fel: #b3261e; /* felmeddelande */
        --mg-print-linje: #ddd; /* utskrift: linje */
        --mg-print-yta: #fafafa; /* utskrift: yta */

        --mg-print-gul: #fffbe6; /* utskrift: gul */

        --mg-print-text: #333; /* utskrift: text */
        --mg-gra: #888; /* grå */
        --mg-gra-ljus: #ccc; /* ljusgrå */
        --mg-bla-a09: rgba(47,107,90,0.09);
        --mg-bla-a22: rgba(47,107,90,0.22);

        --mg-guldmork-a14: rgba(47,107,90,0.14);
        --mg-lila-a40: rgba(18,63,55,0.12);
        --mg-svart-a20: rgba(18,63,55,0.06);

        --mg-svart-a50: rgba(18,63,55,0.14);
        --mg-svart-a60: rgba(18,63,55,0.45);
        --mg-vit-a02: #ffffff;

      }
